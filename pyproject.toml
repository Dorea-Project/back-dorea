[project]
name = "dorea-mobile-api"
version = "0.1.0"
description = "Dorea Church — backend FastAPI (monolithe). Possède le schéma PostgreSQL et le fait évoluer ; expose les surfaces /api/backoffice (PWA) et /api/mobile (Flutter)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pyjwt>=2.10.0",
    "argon2-cffi>=23.1.0",
    "structlog>=24.4.0",
    "pypdf>=6.0.0",  # extraction texte des sermons PDF (contexte sermon, S-5)
    # ⚠️ `python-pptx` sert désormais **deux** usages opposés : l'extraction (sermon, S-5) et
    # l'écriture du deck (urim, livrable). Le plan de retrait de `sermon` supprimerait le
    # premier ; la dépendance reste, et change seulement de justification.
    "python-pptx>=1.0.0",  # lecture (sermon S-5) ET écriture des diapositives (urim)
    # MIT, comme pptx et du même auteur. Poids réel ajouté : ~0,5 Mo — `lxml`, sa seule
    # dépendance, est déjà tirée par `python-pptx`.
    "python-docx>=1.1.0",  # écriture de la note du prédicateur (urim, livrable)
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "aiosqlite>=0.20.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# RUF001-003 signalent les caractères « ambigus » — un `α` grec là où un `a` latin était
# probablement voulu. La garde est bonne partout ailleurs : elle attrape la lettre cyrillique
# collée par accident. Ici l'alphabet grec **est** le sujet du module (table de
# translittération), et chaque lettre y est délibérée. Exempter ce fichier seul, jamais la
# règle : le jour où un `ο` grec s'égare dans un identifiant, on veut encore l'apprendre.
"app/contexts/urim/infrastructure/corpus/translitteration.py" = ["RUF001", "RUF002", "RUF003"]
# Même raison, second fichier : le semis du lexique Strong cite les entrées telles que la
# source les écrit — `α, Ἀλφα`. La lettre grecque y est la donnée, pas une coquille.
"scripts/urim_seed_lexique.py" = ["RUF001", "RUF002", "RUF003"]
# Troisième fichier, même principe : l'extrait de la World English Bible écrit ses élisions avec
# l'apostrophe typographique (`don’t`), comme le fait la source. C'est du **texte biblique** — on
# ne le redresse pas pour faire plaisir au linter, sans quoi l'extrait de développement cesserait
# d'être identique au dataset de production et la leçon de `test_lsg_dataset` se repaierait.
"app/contexts/mission/infrastructure/scripture_web.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
